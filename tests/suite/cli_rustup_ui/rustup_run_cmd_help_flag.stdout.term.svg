<svg width="751px" height="506px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Run a command under a toolchain</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">rustup[EXE] run</tspan><tspan> </tspan><tspan class="fg-cyan">&lt;ARGS&gt;...</tspan>
</tspan>
    <tspan x="10px" y="82px">
</tspan>
    <tspan x="10px" y="100px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="118px"><tspan>  </tspan><tspan class="fg-cyan">&lt;ARGS&gt;...</tspan><tspan>  Toolchain name and command, or a command resolved from rust-toolchain.toml</tspan>
</tspan>
    <tspan x="10px" y="136px">
</tspan>
    <tspan x="10px" y="154px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan><tspan>  Print help</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Discussion:</tspan>
</tspan>
    <tspan x="10px" y="226px"><tspan>  Runs the given program with the toolchain's bin directory and</tspan>
</tspan>
    <tspan x="10px" y="244px"><tspan>  library path set. The command may be any program, not just rustc</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>  or cargo.</tspan>
</tspan>
    <tspan x="10px" y="280px">
</tspan>
    <tspan x="10px" y="298px"><tspan>  The first argument is a toolchain when it is a channel name, an</tspan>
</tspan>
    <tspan x="10px" y="316px"><tspan>  absolute path, or the name of an installed custom toolchain. That</tspan>
</tspan>
    <tspan x="10px" y="334px"><tspan>  toolchain is installed when it is missing. Otherwise every argument</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>  is the command, and the toolchain is resolved the same way as</tspan>
</tspan>
    <tspan x="10px" y="370px"><tspan>  `rustup show`: a +toolchain argument, then rust-toolchain.toml, and</tspan>
</tspan>
    <tspan x="10px" y="388px"><tspan>  an error when neither is present. A toolchain resolved from the</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>  file is installed when it is missing.</tspan>
</tspan>
    <tspan x="10px" y="424px">
</tspan>
    <tspan x="10px" y="442px"><tspan>    </tspan><tspan class="fg-bright-cyan bold">$ rustup run nightly cargo build</tspan>
</tspan>
    <tspan x="10px" y="460px">
</tspan>
    <tspan x="10px" y="478px"><tspan>    </tspan><tspan class="fg-bright-cyan bold">$ rustup run cargo build</tspan>
</tspan>
    <tspan x="10px" y="496px">
</tspan>
  </text>

</svg>
